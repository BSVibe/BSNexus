# =============================================================================
# BSNexus Production Docker Compose
# =============================================================================
# FastAPI backend + React frontend + PostgreSQL + Redis
#
# Usage:
#   docker-compose up -d                     # Backend + infra only
#   docker-compose --profile full up -d      # + Frontend
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ===========================================================================
  # Infrastructure
  # ===========================================================================

  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: bsnexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bsnexus}
      POSTGRES_USER: ${POSTGRES_USER:-bsnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bsnexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - bsnexus-network

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: bsnexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - bsnexus-network

  # ===========================================================================
  # Backend
  # ===========================================================================

  # Work sandbox (Part B) — Docker-in-Docker sidecar. Per-project work
  # sandboxes run INSIDE this daemon, isolated from the host Docker.
  # Privileged (rootless DinD fails on the Docker Desktop linuxkit
  # kernel). One-time setup before flipping SANDBOX_ENABLED on:
  #   DOCKER_HOST=tcp://bsnexus-sandbox-dind:2375 ./scripts/build-sandbox-image.sh
  # builds + `docker save | docker load`s the sandbox image into this
  # daemon (a host build is invisible here).
  # One-shot: a fresh named volume's root is root-owned, but bsnexus-app
  # (uid 1000) must create per-project dirs in it and the sandbox image
  # (uid 1000) must write into them. chown the volume root once before
  # `app` starts.
  workspace-init:
    image: alpine:3
    container_name: bsnexus-workspace-init
    command: ["sh", "-c", "chown 1000:1000 /workspaces && chmod 775 /workspaces"]
    volumes:
      - bsnexus-workspaces:/workspaces
    networks:
      - bsnexus-network

  sandbox-dind:
    logging: *default-logging
    image: docker:27-dind
    container_name: bsnexus-sandbox-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--tls=false"]
    volumes:
      - bsnexus-workspaces:/workspaces
      - sandbox-dind-lib:/var/lib/docker
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 512M
    networks:
      - bsnexus-network

  app:
    logging: *default-logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bsnexus-app
    restart: unless-stopped
    ports:
      - "8100:8000"
    # env_file forwards the entire .env so newly-added vars (e.g. USER_JWT_*
    # for cross-app session JWT verification) reach the container without
    # needing a per-key entry in the `environment:` block below.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bsnexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bsnexus}
      REDIS_URL: redis://redis:6379
      BSVIBE_AUTH_URL: ${BSVIBE_AUTH_URL:-https://auth.bsvibe.dev}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3100}
      PROMPT_SIGNING_KEY: ${PROMPT_SIGNING_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:3100"]}
      EXECUTOR_TYPE: ${EXECUTOR_TYPE:-claude_code}
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-3600}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Work sandbox (Part B). SANDBOX_ENABLED stays false until the
      # sidecar is up and the sandbox image is loaded — flipping it on
      # is the cutover. Rollback = set false + redeploy.
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      DOCKER_HOST: ${DOCKER_HOST:-tcp://bsnexus-sandbox-dind:2375}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspaces}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-dind:
        condition: service_started
      workspace-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    volumes:
      - ../logs:/app/logs
      # Part B — project workspaces on a named volume so the sandbox
      # containers (created inside the DinD) can bind-mount them.
      - bsnexus-workspaces:/workspaces
    networks:
      - bsnexus-network

  # ===========================================================================
  # Frontend (full profile)
  # ===========================================================================

  frontend:
    logging: *default-logging
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: bsnexus-frontend
    restart: unless-stopped
    ports:
      - "3100:80"
    depends_on:
      - app
    profiles:
      - full
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - bsnexus-network

volumes:
  postgres-data:
    name: bsnexus-postgres-data
  redis-data:
    name: bsnexus-redis-data
  # Part B — project workspaces, shared between app and sandbox-dind.
  bsnexus-workspaces:
    name: bsnexus-workspaces
  # The DinD's own image/layer store (keeps the sandbox image across restarts).
  sandbox-dind-lib:
    name: bsnexus-sandbox-dind-lib

networks:
  bsnexus-network:
    driver: bridge
    name: bsnexus-network
