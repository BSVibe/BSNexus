# =============================================================================
# BSNexus Demo Stack
# =============================================================================
# Public interactive demo deployment.
#
# - Per-visitor ephemeral tenants (auto-created on /api/v1/demo/session)
# - Separate JWT issuer (DEMO_JWT_SECRET, NOT prod auth.bsvibe.dev)
# - MockExecutor (no real worker exec, scripted plan-tree advance)
# - Cross-product demo URLs (api-demo-{sage,gateway,supervisor})
#
# Ports (see ~/Works/_infra/port-map.md):
#   APP   8600
#   PG    5934
#   REDIS 6881
#
# Domain: api-demo-nexus.bsvibe.dev → localhost:8600 (via Caddy)
#
# Usage:
#   docker compose -f deploy/docker-compose.demo.yml --env-file deploy/.env.demo up -d
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: bsnexus-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bsnexus_demo}
      POSTGRES_USER: ${POSTGRES_USER:-bsnexus_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5934:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bsnexus_demo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - bsnexus-demo-network

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: bsnexus-demo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6881:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - bsnexus-demo-network

  app:
    logging: *default-logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bsnexus-demo-app
    restart: unless-stopped
    ports:
      - "8600:8000"
    env_file: .env.demo
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bsnexus_demo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bsnexus_demo}
      REDIS_URL: redis://redis:6379
      BSVIBE_DEMO_MODE: "true"
      DEMO_JWT_SECRET: ${DEMO_JWT_SECRET:?DEMO_JWT_SECRET is required for demo backend}
      EXECUTOR_TYPE: mock
      FRONTEND_URL: ${FRONTEND_URL:-https://demo-nexus.bsvibe.dev}
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-["https://demo-nexus.bsvibe.dev"]}'
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-mock}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    volumes:
      - ../logs-demo:/app/logs
    networks:
      - bsnexus-demo-network

volumes:
  postgres-data:
    name: bsnexus-demo-postgres-data
  redis-data:
    name: bsnexus-demo-redis-data

networks:
  bsnexus-demo-network:
    driver: bridge
    name: bsnexus-demo-network
