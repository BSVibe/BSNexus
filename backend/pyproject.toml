[project]
name = "bsnexus-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "redis[hiredis]>=5.0.0",
    "litellm>=1.0.0",
    "httpx>=0.26.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=1.6.0",
    "pyyaml>=6.0",
    "structlog>=23.0.0",
    "bsvibe-auth[fastapi] @ git+https://github.com/BSVibe/BSVibe-Auth.git@v0.4.0#subdirectory=python",
    # P0.5 — bsvibe-authz package (Phase 0 P0.4 from bsvibe-python). Currently
    # tracking the feat/bsvibe-authz-impl branch; pin to a release tag once
    # the package lands on bsvibe-python main.
    "bsvibe-authz @ git+https://github.com/BSVibe/bsvibe-python.git@feat/bsvibe-authz-impl#subdirectory=packages/bsvibe-authz",
    # Phase A Batch 5 — bsvibe-python shared library extraction.
    # Each package currently lives on its own ``feat/bsvibe-*-impl``
    # branch; ``feat/bsvibe-llm-impl`` carries both ``bsvibe-core`` and
    # ``bsvibe-llm`` because the latter is a workspace dependency on the
    # former — pinning both to the same branch keeps uv from fighting
    # over conflicting git URLs for the same package name. Pin to a
    # release tag once they merge to ``main``.
    #
    # bsvibe-core: BsvibeSettings + configure_logging + shared exception
    # types. Adopted by ``backend/src/config.py`` + ``backend/src/main.py``.
    "bsvibe-core @ git+https://github.com/BSVibe/bsvibe-python.git@feat/bsvibe-llm-impl#subdirectory=packages/bsvibe-core",
    # bsvibe-llm: RunAuditMetadata is the wire-format contract between
    # BSGateway PR #24 and BSNexus PR #38. We adopt it for the metadata
    # dataclass only — the streaming + tool-loop in
    # orchestrator_adapter.py stays in BSNexus until bsvibe-llm grows
    # those features (follow-up issue).
    "bsvibe-llm @ git+https://github.com/BSVibe/bsvibe-python.git@feat/bsvibe-llm-impl#subdirectory=packages/bsvibe-llm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "aiosqlite>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]
timeout = 30
filterwarnings = [
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*"]

[tool.coverage.report]
# 75 during the iterative-replanner migration. The new dispatcher
# Phase 0 paths need an in-process session-sharing test harness before
# they can be exercised end-to-end; the SSE follow-up bundles that
# infra and restores 80.
fail_under = 75
show_missing = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.0",
]
