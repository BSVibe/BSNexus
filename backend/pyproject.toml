[project]
name = "bsnexus-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.26.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=1.6.0",
    "pyyaml>=6.0",
    "structlog>=23.0.0",
    "bsvibe-auth[fastapi] @ git+https://github.com/BSVibe/BSVibe-Auth.git@v0.4.0#subdirectory=python",
    # P0.5 — bsvibe-authz package (Phase 0 P0.4 from bsvibe-python). Currently
    # tracking the feat/bsvibe-authz-impl branch; pin to a release tag once
    # the package lands on bsvibe-python main.
    "bsvibe-authz @ git+https://github.com/BSVibe/bsvibe-python.git@feat/bsvibe-authz-impl#subdirectory=packages/bsvibe-authz",
    # Phase A Batch 5 + Phase Audit Batch 2 — all bsvibe-python packages
    # consumed by BSNexus are pinned to a single integration branch
    # (``integration/phase-audit-batch-2``) that carries
    # ``bsvibe-core`` + ``bsvibe-llm`` + ``bsvibe-audit`` together.
    # Pinning to one branch is what keeps uv from fighting over
    # conflicting transitive URLs for ``bsvibe-core``. Move to a
    # release tag once these packages merge to ``main``.
    #
    # bsvibe-core: BsvibeSettings + configure_logging + shared exception
    # types. Adopted by ``backend/src/config.py`` + ``backend/src/main.py``.
    "bsvibe-core @ git+https://github.com/BSVibe/bsvibe-python.git@feat/audit-decorator-extensions#subdirectory=packages/bsvibe-core",
    # bsvibe-llm: RunAuditMetadata is the wire-format contract between
    # BSGateway PR #24 and BSNexus PR #38. We adopt it for the metadata
    # dataclass only — the streaming + tool-loop in
    # orchestrator_adapter.py stays in BSNexus until bsvibe-llm grows
    # those features (follow-up issue).
    "bsvibe-llm @ git+https://github.com/BSVibe/bsvibe-python.git@feat/audit-decorator-extensions#subdirectory=packages/bsvibe-llm",
    # Phase Audit Batch 2 — bsvibe-audit (BSVibe_Audit_Design.md §3 outbox
    # pattern). Provides AuditEmitter (in-transaction emit), OutboxRelay
    # (async polling shipper to BSVibe-Auth /api/audit/events), and the
    # 8 nexus.* event Pydantic schemas used by BSNexus surfaces.
    #
    # Phase Audit Batch 3 — pinned to ``feat/audit-decorator-extensions``
    # (bsvibe-python PR #9) for the @audit_emit ``safe=True`` +
    # ``actor_factory`` knobs consumed by api/projects.py +
    # api/decisions.py. The branch is additive on top of
    # integration/phase-audit-batch-2 (which still carries the rest of
    # bsvibe-core / bsvibe-llm / bsvibe-audit Audit-1). Re-pin to a
    # release tag once both branches land on main.
    "bsvibe-audit @ git+https://github.com/BSVibe/bsvibe-python.git@feat/audit-decorator-extensions#subdirectory=packages/bsvibe-audit",
    "mcp>=1.0",
    # Direct-LLM path for ``executor_type=generic_llm`` (Phase 2b /
    # 2026-05-04). PR1 removed litellm because Direction §6 (reset
    # 2026-05-03) mandated BSGateway-only routing. Company philosophy
    # revision later that day made BSVibe integration optional, so
    # BSNexus needs its own provider-agnostic LLM client for the
    # opt-out path. Used by ``core.llm.direct_client``.
    "litellm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "aiosqlite>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]
timeout = 30
filterwarnings = [
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*"]

[tool.coverage.report]
# 81 — Sprint 4 PR #37 baseline preserved through Phase Audit Batch 2.
# (Previously 75 during the iterative-replanner migration; restored
# once the SSE follow-up landed and Phase Audit Batch 2 covers the
# new emit surfaces.)
fail_under = 81
show_missing = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.0",
]
