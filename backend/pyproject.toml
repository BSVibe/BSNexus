[project]
name = "bsnexus-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "redis[hiredis]>=5.0.0",
    "litellm>=1.0.0",
    "httpx>=0.26.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=1.6.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "structlog>=23.0.0",
    "bsvibe-auth[fastapi] @ git+https://github.com/blas1n/BSVibe-Auth.git@v0.2.0#subdirectory=python",
]

[project.scripts]
bsnexus = "backend.src.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "aiosqlite>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]
filterwarnings = [
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "src/cli/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]
