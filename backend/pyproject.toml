[project]
name = "bsnexus-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.26.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=1.6.0",
    "pyyaml>=6.0",
    "structlog>=23.0.0",
    "bsvibe-auth[fastapi] @ git+https://github.com/BSVibe/BSVibe-Auth.git@v0.5.0#subdirectory=python",
    # the package lands on bsvibe-python main.
    "bsvibe-authz @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-authz",
    # Phase A Batch 5 + Phase Audit Batch 2 — all bsvibe-python packages
    # consumed by BSNexus are pinned to a single integration branch
    # (``integration/phase-audit-batch-2``) that carries
    # ``bsvibe-core`` + ``bsvibe-llm`` + ``bsvibe-audit`` together.
    # Pinning to one branch is what keeps uv from fighting over
    # conflicting transitive URLs for ``bsvibe-core``. Move to a
    # release tag once these packages merge to ``main``.
    #
    # bsvibe-core: BsvibeSettings + configure_logging + shared exception
    # types. Adopted by ``backend/src/config.py`` + ``backend/src/main.py``.
    "bsvibe-core @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-core",
    # bsvibe-llm: RunAuditMetadata is the wire-format contract between
    # BSGateway PR #24 and BSNexus PR #38. We adopt it for the metadata
    # dataclass only — the streaming + tool-loop in
    # orchestrator_adapter.py stays in BSNexus until bsvibe-llm grows
    # those features (follow-up issue).
    "bsvibe-llm @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-llm",
    # Phase Audit Batch 2 — bsvibe-audit (BSVibe_Audit_Design.md §3 outbox
    # pattern). Provides AuditEmitter (in-transaction emit), OutboxRelay
    # (async polling shipper to BSVibe-Auth /api/audit/events), and the
    # 8 nexus.* event Pydantic schemas used by BSNexus surfaces.
    #
    # Phase Audit Batch 3 — pinned to ``feat/audit-decorator-extensions``
    # (bsvibe-python PR #9) for the @audit_emit ``safe=True`` +
    # ``actor_factory`` knobs consumed by api/projects.py +
    # api/decisions.py. The branch is additive on top of
    # integration/phase-audit-batch-2 (which still carries the rest of
    # bsvibe-core / bsvibe-llm / bsvibe-audit Audit-1). Re-pin to a
    # release tag once both branches land on main.
    "bsvibe-audit @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-audit",
    "mcp>=1.0",
    # G6.2 (2026-05-11): the direct ``litellm`` pin is gone. BSNexus's
    # ``DirectLLMAdapter`` now routes through ``bsvibe_llm.LlmClient``
    # (``direct=True``), which owns the retry / fallback / wire-
    # contract layer for every BSVibe product. ``litellm`` is a
    # transitive dep of ``bsvibe-llm``. The ``test_litellm_is_fenced
    # _to_core_llm`` guard enforces zero direct ``litellm`` imports
    # under ``backend/src/``.
    # Demo stack helpers — JWT, LLM mock guard, tenant GC, session service.
    # Lives on feat/bsvibe-demo until merged.
    "bsvibe-demo[sqlalchemy] @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-demo",
    # Phase 5a — `bsnexus` Typer CLI built on bsvibe-cli-base. Provides
    # cli_app + ProfileStore + OutputFormatter + CliHttpClient +
    # DeviceFlowClient. Pinned to bsvibe-python main alongside the rest
    # of the Phase 4/5 CLI rollout (see BSVibe_AI_Native_Control_Plane_Plan_2026-05-06.md §Phase 5).
    "bsvibe-cli-base @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-cli-base",
]

[project.scripts]
# Phase 5a — `bsnexus` Typer CLI built on bsvibe-cli-base. The wheel
# (see ``[tool.hatch.build.targets.wheel]`` below) ships only the CLI
# subtree, remapped from ``backend/src/cli/`` to a top-level
# ``bsnexus_cli`` package so ``uv run bsnexus`` resolves
# ``bsnexus_cli.main:app``. Tests still import the same files via
# ``backend.src.cli.…`` (see pytest ``pythonpath=[".."]``).
bsnexus = "bsnexus_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Minimal wheel — only the CLI subtree is shipped (packaging the whole
# backend would conflict with the in-tree ``backend.src.…`` import
# path the rest of the repo uses). ``force-include`` remaps
# ``src/cli/`` → ``bsnexus_cli/`` so the installed entrypoint resolves.
# ``bypass-selection`` skips hatch's auto-package discovery so it
# doesn't error on the absence of a top-level ``bsnexus_backend``.
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"src/cli" = "bsnexus_cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "aiosqlite>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]
timeout = 30
filterwarnings = [
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]
markers = [
    "live_ollama: hits the local ollama daemon at :11434; opt-in via -m live_ollama",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    # Demo backend module — gated behind BSVIBE_DEMO_MODE, only loaded
    # in the public demo deployment (demo-nexus.bsvibe.dev). Excluded
    # from prod coverage gate.
    "*/demo/*",
]

[tool.coverage.report]
# G0 greenfield backend reset deleted legacy execution/proof/API tests with
# their legacy surfaces. This temporary baseline keeps the CI coverage gate
# meaningful for the reduced backend while G1 rebuilds proof/execution tests.
fail_under = 50
show_missing = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.0",
]
