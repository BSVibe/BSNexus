name: request-classifier
version: 1
description: >
  Cheap-LLM classifier that buckets every user message into chit_chat /
  question / request / modification. Output is strict JSON consumed by
  RequestExtractor.

variants:
  default:
    body: |-
      Classify the user message into exactly one of: chit_chat, question, request, modification. If 'request' or 'modification', also produce a concise intent summary (max 200 chars). Respond as JSON: {"intent":"...","intent_summary":"...","confidence":0.0}
