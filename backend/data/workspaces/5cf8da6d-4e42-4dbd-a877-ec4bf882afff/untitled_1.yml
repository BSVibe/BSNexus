version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backend_container
    ports:
      - "8000:8000"
    environment:
      - ENV=development
    networks:
      - app-network
    # 백엔드가 준비될 때까지 프론트엔드를 기다리게 하려면 아래 주석 해제
    # depends_on:
    #   - frontend

  frontend:
    build: ./frontend
    container_name: frontend_container
    ports:
      - "80:80"
    environment:
      # 백엔드 서비스 이름을 사용하여 API 주소 설정
      - REACT_APP_API_URL=http://backend:8000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge