[project]
name = "bsnexus-worker"
version = "0.1.0"
description = "BSNexus self-hosted worker agent — runs on your machine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "structlog>=23.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
bsnexus-worker = "worker.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
