services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-Asia/Seoul}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    user: vscode
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - claude-code-bashhistory:/commandhistory
      - ~/.claude:/home/vscode/.claude:cached
      # Part B — shared workspace volume; the same volume is mounted in
      # sandbox-dind at the same path so a sandbox container created
      # with `-v /workspaces/<id>:/work` resolves inside the DinD.
      - bsnexus-workspaces:/workspaces
    ports:
      - "${EXTERNAL_BACKEND_PORT:-8000}:8000"
      - "${EXTERNAL_FRONTEND_PORT:-3000}:3000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - ENVIRONMENT=development
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - UV_LINK_MODE=copy
      # Part B work sandbox — DinD endpoint + workspace volume path.
      # SANDBOX_ENABLED stays false: the sidecar exists for integration
      # tests; the loop runs host-side until PR 8 flips it.
      - DOCKER_HOST=tcp://sandbox-dind:2375
      - WORKSPACE_ROOT=/workspaces
      - SANDBOX_ENABLED=false
    stdin_open: true
    tty: true
    command: >
      sh -c "zsh && sudo /usr/local/bin/init-firewall.sh"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-dind:
        condition: service_started
      workspace-init:
        condition: service_completed_successfully
    networks:
      - bsnexus-network

  # One-shot: chown the fresh workspace volume root to uid 1000 so the
  # app + the uid-1000 sandbox image can create/write project dirs.
  workspace-init:
    image: alpine:3
    command: ["sh", "-c", "chown 1000:1000 /workspaces && chmod 775 /workspaces"]
    volumes:
      - bsnexus-workspaces:/workspaces
    networks:
      - bsnexus-network

  # Part B — Docker-in-Docker sidecar. Per-project work sandboxes run
  # INSIDE this daemon, isolated from the host Docker. Privileged (not
  # rootless — rootless DinD fails on the Docker Desktop linuxkit
  # kernel). DOCKER_TLS_CERTDIR empty → unencrypted TCP on 2375.
  sandbox-dind:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["--tls=false"]
    volumes:
      - bsnexus-workspaces:/workspaces
      - sandbox-dind-lib:/var/lib/docker
    networks:
      - bsnexus-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bsnexus}
      - POSTGRES_USER=${POSTGRES_USER:-bsnexus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bsnexus_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infra/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bsnexus-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsnexus-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-bsnexus}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-bsnexus_dev_secret}
    volumes:
      - minio-data:/data
    # No host port mapping: BSNexus connects via the bsnexus-network bridge
    # (e.g. http://minio:9000). Adding `ports:` causes slot collisions with
    # other worktrees / the prod minio. Re-add temporarily if you need the
    # console (http://minio:9001) from a host browser.
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsnexus-network

volumes:
  claude-code-bashhistory:
  redis-data:
  postgres-data:
  minio-data:
  # Part B — project workspaces, shared between app and sandbox-dind.
  bsnexus-workspaces:
  # DinD's own image/layer store (so the sandbox image survives restarts).
  sandbox-dind-lib:


networks:
  bsnexus-network:
    driver: bridge
